<style>
  /* Inline so it paints before the stylesheet arrives. */
  html { background: #18181a; }
  html[data-theme='light'] { background: #ffffff; }
  html[data-theme='black'] { background: #000000; }
  html[data-theme='paper'] { background: #f4f2ec; }
  #loader {
    position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
    background: #18181a; color: #f0efe9;
    transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1);
    animation: loader-failsafe 0s linear 6s forwards;
  }
  html[data-theme='light'] #loader { background: #ffffff; color: #18181a; }
  html[data-theme='black'] #loader { background: #000000; color: #f5f5f5; }
  html[data-theme='paper'] #loader { background: #f4f2ec; color: #1c1b18; }
  #loader.out { transform: translateY(-100%); }
  #loader svg { width: 84px; height: 84px; overflow: visible; }
  #loader rect { --x: -42px; --y: 0px; animation: loader-tile 0.42s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  #loader rect.diagonal { --x: 28px; --y: -28px; }
  @keyframes loader-tile {
    from { opacity: 0; transform: translate(var(--x), var(--y)); }
    to { opacity: 1; transform: none; }
  }
  @keyframes loader-failsafe { to { visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    #loader { transition: opacity 0.15s linear; }
    #loader.out { transform: none; opacity: 0; }
    #loader rect { animation: none; }
  }
</style>
<div id="loader" aria-hidden="true">
  <svg viewBox="0 0 98 98">
    <rect style="animation-delay: 0ms" x="0" y="0" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect style="animation-delay: 45ms" x="20" y="0" width="18" height="18" rx="2.5" fill="#8a8a8a" />
    <rect style="animation-delay: 90ms" x="40" y="0" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect style="animation-delay: 135ms" x="60" y="0" width="18" height="18" rx="2.5" fill="#8a8a8a" />
    <rect style="animation-delay: 180ms" x="80" y="0" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect class="diagonal" style="animation-delay: 225ms" x="60" y="20" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect class="diagonal" style="animation-delay: 270ms" x="40" y="40" width="18" height="18" rx="2.5" fill="#e8683a" />
    <rect class="diagonal" style="animation-delay: 315ms" x="20" y="60" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect style="animation-delay: 360ms" x="0" y="80" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect style="animation-delay: 405ms" x="20" y="80" width="18" height="18" rx="2.5" fill="#8a8a8a" />
    <rect style="animation-delay: 450ms" x="40" y="80" width="18" height="18" rx="2.5" fill="currentColor" />
    <rect style="animation-delay: 495ms" x="60" y="80" width="18" height="18" rx="2.5" fill="#8a8a8a" />
    <rect style="animation-delay: 540ms" x="80" y="80" width="18" height="18" rx="2.5" fill="currentColor" />
  </svg>
</div>
<script>
  (function () {
    var loader = document.getElementById('loader');
    var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var minimum = reduced ? 0 : 1050;
    var started = performance.now();
    var hidden = false;
    function hide() {
      if (hidden) return;
      hidden = true;
      setTimeout(function () {
        loader.classList.add('out');
        setTimeout(function () { loader.remove(); }, 700);
      }, Math.max(0, minimum - (performance.now() - started)));
    }
    addEventListener('load', function () {
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(hide, hide);
    });
    setTimeout(hide, 4000);
  })();
</script>
